<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodify - Smart Mood Companion</title>
  <link rel="stylesheet" href="styles/style.css" />
  
  <style>
    /* PAGE SPECIFIC STYLES */
    .herosection {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }

    .mainheading {
      font-family: "Newsreader", serif;
      font-size: 4.5rem;
      margin-bottom: 2rem;
      color: #1b1c1a;
      line-height: 1.05;
    }

    .subtitletext {
      color: #53443c;
      font-size: 1.4rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .moodgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 3rem;
      margin-top: 3rem;
    }

    /* CARD STYLES FOR INDEX */
    .moodcard {
      background: #ffffff;
      border: 1px solid rgba(133, 115, 106, 0.15);
      border-radius: 32px;
      padding: 3.5rem 2.5rem;
      box-shadow: 0 24px 48px rgba(27, 28, 26, 0.04);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .moodcard:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: rgba(46, 125, 130, 0.3);
      box-shadow: 0 40px 100px -15px rgba(0, 0, 0, 0.08);
      background: #fffefc;
    }

    .cardtitle {
      font-size: 1.75rem;
      font-family: "Newsreader", serif;
      font-weight: 500;
      color: #1b1c1a;
    }

    .moodcard:hover .cardtitle {
      color: #884d27;
    }
  </style>
</head>
<body>

  <!-- NAVBAR SECTION -->
  <div class="navbar-section">
    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="navlogo">Moodify</a>
      </div>
      <nav class="navlinks">
        <a class="navbtn" href="index.html"> Home </a>
        <a class="navbtn" href="content.html"> Discover </a>
        <a class="navbtn" href="chatbot.html"> Chat </a>
        <a class="navbtn" href="notes.html"> Notes </a>
        <button id="winter-toggle-btn" class="winter-toggle-btn" type="button" title="Toggle Winter Snow Effect">❄️ Winter Mode</button>
      </nav>
    </header>
  </div>

  <!-- HERO SECTION -->
  <div class="maincontainer">
    <div class="herosection">
      <h1 class="mainheading">How are you feeling right now?</h1>
      <p class="subtitletext">Select your current mood below so we can personalize your digital environment and curate content tailored specifically to your state of mind.</p>
      
      <div class="moodgrid" id="mood-grid">
        <!-- MOOD CARDS GENERATED BY JS -->
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/index.js"></script>
  <script src="js/winter-mode.js"></script>
  <script src="js/winter-integration.js"></script>
</body>
</html>
